[project]
name = "sherd-agent"
version = "0.1.0"
requires-python = ">=3.12"
description = "Read-only natural-language questions over your data"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vlad Soimu" }]
keywords = ["personal-data", "privacy", "local-first"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Operating System :: MacOS", "Operating System :: POSIX :: Linux"]



dependencies = [
    'sherd-core>=0.1.0,<0.2',
    'sherd-insights>=0.1.0,<0.2',
    'anthropic>=1.11',
    'openai>=3.24',
    'httpx>=0.28',
    'pydantic>=2.11',
    'duckdb>=1',
    'pyarrow>=20',
    'pyyaml>=6',
]

[project.urls]
Homepage = "https://github.com/Soimanul/sherd"
Source = "https://github.com/Soimanul/sherd"

[dependency-groups]
dev = ['sherd-connectors>=0.1.0,<0.2']

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.sources]
sherd-core = { workspace = true }
sherd-insights = { workspace = true }
sherd-connectors = { workspace = true }
