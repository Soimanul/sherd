  <g fill="#3a322d">
    <rect x="20.4" y="42.2" width="1.8" height="4" rx="0.9" transform="rotate(-8 21.3 44.2)"/>
    <rect x="23.2" y="41.6" width="1.8" height="4.2" rx="0.9"/>
    <rect x="26" y="41.2" width="1.8" height="4" rx="0.9" transform="rotate(8 26.9 43.2)"/>
    <rect x="36.2" y="41.2" width="1.8" height="4" rx="0.9" transform="rotate(-8 37.1 43.2)"/>
    <rect x="39" y="41.6" width="1.8" height="4.2" rx="0.9"/>
    <rect x="41.8" y="42.2" width="1.8" height="4" rx="0.9" transform="rotate(8 42.7 44.2)"/>
