<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="owl-title">
  <title id="owl-title">sherd owl holding a pottery sherd</title>
  <defs>
    <!-- the body stops at a gap just above the sherd's rim -->
    <mask id="owl-body-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M5.6 44.6Q32 36.2 58.4 44.6L64 64H0Z" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#owl-body-cut)">
