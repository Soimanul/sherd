[project]
name = "sherd-web"
version = "0.1.0"
requires-python = ">=3.12"
description = "Private local dashboards for your data"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vlad Soimu" }]
keywords = ["personal-data", "privacy", "local-first"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Operating System :: MacOS", "Operating System :: POSIX :: Linux"]



dependencies = ['sherd-core>=0.1.0,<0.2', 'sherd-insights>=0.1.0,<0.2', 'fastapi>=0.115', 'jinja2>=3.1', 'uvicorn>=0.34', 'pyyaml>=6',
    'sherd-agent>=0.1.0,<0.2',
    'sherd-connectors>=0.1.0,<0.2',
]

[project.urls]
Homepage = "https://github.com/Soimanul/sherd"
Source = "https://github.com/Soimanul/sherd"

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx2>=2.13", "sherd-connectors>=0.1.0,<0.2"]

[tool.uv.sources]
sherd-core = { workspace = true }
sherd-insights = { workspace = true }
sherd-connectors = { workspace = true }
sherd-agent = { workspace = true }
