[project]
name = "sherd-connectors"
version = "0.1.0"
requires-python = ">=3.12"
description = "Import your personal data exports locally"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vlad Soimu" }]
keywords = ["personal-data", "privacy", "local-first"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Operating System :: MacOS", "Operating System :: POSIX :: Linux"]



dependencies = [
    'sherd-core>=0.1.0,<0.2',
    'ijson>=3.4',
    'pyyaml>=6',
]

[project.urls]
Homepage = "https://github.com/Soimanul/sherd"
Source = "https://github.com/Soimanul/sherd"

[project.optional-dependencies]
fast = ['sherd-wa>=0.1.0,<0.2']

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.sources]
sherd-core = { workspace = true }
sherd-wa = { workspace = true }
