  <path fill="#ea9453" d="M8.2 46.6Q32 39 55.8 46.6L55.3 48.6Q32 41.4 8.7 48.6Z"/>
  <path fill="none" stroke="#9d4b28" stroke-width="1.2" stroke-linecap="round" d="M12.4 51.4Q32 45.2 51.6 51.4"/>
