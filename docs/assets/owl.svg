    <!-- breast feathers -->
    <path fill="#a8937e" d="M11.5 31C14.2 37.6 20.6 41.6 32 41.6S49.8 37.6 52.5 31V44H11.5Z"/>
  </g>
  <!-- facial disc -->
  <path fill="#e9ddcf" d="M32 19.8C28.6 16.6 24.6 15.4 21 16.2 15.3 17.5 13.4 23.8 15.6 29.4 17.4 34 22.5 36.8 27.6 35.6 29.6 35.1 31 34.2 32 33 33 34.2 34.4 35.1 36.4 35.6 41.5 36.8 46.6 34 48.4 29.4 50.6 23.8 48.7 17.5 43 16.2 39.4 15.4 35.4 16.6 32 19.8Z"/>
  <!-- eyes -->
  <circle cx="23.4" cy="26" r="7" fill="#1f1c19"/>
  <circle cx="40.6" cy="26" r="7" fill="#1f1c19"/>
  <circle cx="23.4" cy="26" r="4.2" fill="#f5c076"/>
  <circle cx="40.6" cy="26" r="4.2" fill="#f5c076"/>
  <circle cx="23.4" cy="26" r="2.2" fill="#1f1c19"/>
  <circle cx="40.6" cy="26" r="2.2" fill="#1f1c19"/>
  <circle cx="22.2" cy="24.6" r="0.9" fill="#f3ebe3"/>
  <circle cx="39.4" cy="24.6" r="0.9" fill="#f3ebe3"/>
  <!-- beak -->
  <path fill="#3a322d" d="M29.2 32.4H34.8L32 38Z"/>
