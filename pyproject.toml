[tool.uv.workspace]
members = ["packages/*", "crates/sherd-wa"]

[dependency-groups]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]
dev = ["ruff>=0.12", "mypy>=1.17", "pytest>=8", "pytest-socket>=0.7", "pre-commit>=4"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["packages/*/src", "packages/*/tests", "tests", "scripts"]
namespace_packages = true
explicit_package_bases = true
mypy_path = [".", "packages/core/src", "packages/connectors/src", "packages/insights/src", "packages/agent/src", "packages/web/src", "packages/mcp/src", "packages/cli/src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
testpaths = ["packages", "tests"]
pythonpath = ["."]
